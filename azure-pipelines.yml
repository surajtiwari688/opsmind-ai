trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      java -version
      echo "JAVA_HOME is set to $JAVA_HOME"
    displayName: 'Check Java Version'

  - script: |
      cd opsmind-ai
      chmod +x mvnw
      ./mvnw clean package -DskipTests
    displayName: 'Build spring Boot Application'

  - script: |
      cd opsmind-ai
      ./mvnw test
    displayName: 'Run UnitTests'