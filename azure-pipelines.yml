trigger: 
  - main
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:

  # - script: |
  #     echo "Current Directory:"
  #     pwd

  #     echo ""
  #     echo "Files in Current Directory:"
  #     ls -la

  #     echo ""
  #     echo "All Project Files:"
  #     find . maxdepth 3 -type f | sort
  #   displayName: 'Check Repository Structure'

  - checkout: self
    displayName: 'Checkout OpsMind-AI Repository'

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Install Java 21'

  - bash: |
      java -version
      echo "JAVA_HOME is set to $JAVA_HOME"
    displayName: 'Check Java Version'

  - bash: |
      chmod +x mvnw
      ./mvnw clean package -DskipTests
    workingDirectory: 'opsmind-api'
    displayName: 'Build spring Boot Application'

  - bash: |
      ./mvnw test
    workingDirectory: 'opsmind-api'
    displayName: 'Run Unit Tests'

  - bash: |
      echo "Resolving Maven Dependencies..."

      ./mvnw dependency:resolve
    workingDirectory: 'opsmind-api'
    displayName: 'Resolve Maven Dependencies'

  - bash: |
      echo "Starting Trivy Filesystem vulnerability Scan..."

      docker run --rm \
        -v "$(pwd):/workspace" \
        -v "$(echo $HOME)/.m2:/root/.m2" \
        aquasec/trivy:latest \
        fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --offline-scan \
        /workspace/opsmind-api

    displayName: 'Run Trivy Filesystem Vulnerability Scan'

  - bash: |
      echo "Building Docker Image for Spring Boot Application..."
      docker build \
        -t opsmindaiacr2026.azurecr.io/opsmind-api:${BUILD_BUILDID} \
        opsmind-api
    
    displayName: 'Build Docker Image for Spring Boot Application'

  - bash: |
      echo "Starting Trivy Docker Image vulnerability Scan..."

      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest \
        image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 0 \
        --timeout 10m \
        opsmindaiacr2026.azurecr.io/opsmind-api:${BUILD_BUILDID}

    displayName: 'Run Trivy Docker Image Vulnerability Scan'

  - task: AzureCLI@2
    displayName: 'Push Docker Image to ACR'
    inputs:
      azureSubscription: 'sc-opsmind-azure'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "Logging in to Azure Container Registry..."

        az acr login --name opsmindaiacr2026
        echo "Pushing Docker Image to ACR..."
        docker push opsmindaiacr2026.azurecr.io/opsmind-api:${BUILD_BUILDID}
        echo "Docker Image pushed to ACR successfully."

