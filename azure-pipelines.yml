trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:

  # - script: |
  #     echo "Current Directory:"
  #     pwd

  #     echo ""
  #     echo "Files in Current Directory:"
  #     ls -la

  #     echo ""
  #     echo "All Project Files:"
  #     find . maxdepth 3 -type f | sort
  #   displayName: 'Check Repository Structure'

  - checkout: self
    displayName: 'Checkout OpsMind-AI Repository'

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Install Java 21'

  - bash: |
      java -version
      echo "JAVA_HOME is set to $JAVA_HOME"
    displayName: 'Check Java Version'

  - bash: |
      chmod +x mvnw
      ./mvnw clean package -DskipTests
    workingDirectory: 'opsmind-api'
    displayName: 'Build spring Boot Application'

  - bash: |
      ./mvnw test
    workingDirectory: 'opsmind-api'
    displayName: 'Run Unit Tests'

  - bash: |
      echo "Resolving Maven Dependencies..."

      ./mvnw dependency:resolve
    workingDirectory: 'opsmind-api'
    displayName: 'Resolve Maven Dependencies'

  - bash: |
      echo "Starting Trivy Filesystem vulnerability Scan..."

      docker run --rm \
        -v "$(pwd):/workspace" \
        -v "$(echo $HOME)/.m2:/root/.m2" \
        aquasec/trivy:latest \
        fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        --offline-scan \
        /workspace/opsmind-api

    displayName: 'Run Trivy Filesystem Vulnerability Scan'